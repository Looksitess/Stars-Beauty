<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Послуги — Stars Beauty</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#fffdf7,#f3e2b6);font:15px Arial;color:#302719}.wrap{max-width:950px;margin:auto;padding:20px}.panel,.item{background:#fffdf7;border:1px solid #e8d8b5;border-radius:16px;padding:18px;margin:15px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}input,textarea{width:100%;padding:11px;border:1px solid #e3d4b4;border-radius:9px;font:inherit}textarea{min-height:70px}.btn{padding:10px 14px;border:0;border-radius:9px;background:#bb9139;color:white;font-weight:700;cursor:pointer}.actions{display:flex;gap:8px;flex-wrap:wrap}.muted{color:#786d5c}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><p><a href="index.html">← Адмін-панель</a></p><h1>Послуги Stars Beauty</h1><p class="muted">Додавайте послуги, змінюйте ціну та тривалість. Каталог автоматично оновиться на головній сторінці.</p><section class="panel"><form id="serviceForm" class="grid"><input name="name" required minlength="2" maxlength="120" placeholder="Назва послуги"><input name="category" required placeholder="Категорія, наприклад Манікюр"><input name="price_label" placeholder="Ціна, наприклад від 500 грн"><input name="duration_minutes" type="number" min="10" max="600" value="60" required placeholder="Тривалість у хвилинах"><textarea class="full" name="description" placeholder="Короткий опис"></textarea><button class="btn">Додати послугу</button><span id="msg" class="muted"></span></form></section><div id="list"></div></main><script>
const db=window.supabase.createClient("https://evtamvfgftwymlttzvxh.supabase.co","sb_publishable__ERwIrzKtseUBZ60gRHefg_lh4E68K6");async function auth(){const s=await db.auth.getSession();if(!s.data.session){location.href="index.html";return false;}if(s.data.session.user?.email?.toLowerCase()!=="timassites@gmail.com"){await db.auth.signOut();location.href="index.html?reason=wrong-account";return false;}return true;}const esc=v=>String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");
async function load(){if(!await auth())return;const r=await db.from("services").select("*").order("sort_order").order("created_at");if(r.error){document.getElementById("list").textContent=r.error.message;return;}document.getElementById("list").innerHTML=r.data.map(x=>'<article class="item"><b>'+esc(x.name)+'</b> · '+esc(x.category)+'<p>'+esc(x.price_label)+' · '+x.duration_minutes+' хв · '+(x.active?"Активна":"Прихована")+'</p><div class="actions"><button class="btn" onclick="editService(\''+x.id+'\')">Змінити</button><button class="btn" onclick="toggleService(\''+x.id+'\','+(!x.active)+')">'+(x.active?"Приховати":"Показати")+'</button><button class="btn" onclick="deleteService(\''+x.id+'\')">Видалити</button></div></article>').join("")||'<p>Послуг поки немає.</p>';}
window.editService=async id=>{const r=await db.from("services").select("*").eq("id",id).single();if(r.error)return;const x=r.data;const name=prompt("Назва послуги:",x.name);if(name===null)return;const category=prompt("Категорія:",x.category);if(category===null)return;const price_label=prompt("Ціна:",x.price_label);if(price_label===null)return;const duration_minutes=Number(prompt("Тривалість у хвилинах:",x.duration_minutes)||x.duration_minutes);const description=prompt("Опис:",x.description||"");const u=await db.from("services").update({name,category,price_label,duration_minutes,description,updated_at:new Date().toISOString()}).eq("id",id);if(u.error)alert(u.error.message);load();};
window.toggleService=async(id,active)=>{const r=await db.from("services").update({active,updated_at:new Date().toISOString()}).eq("id",id);if(r.error)alert(r.error.message);load();};
window.deleteService=async id=>{if(!confirm("Видалити цю послугу?"))return;const r=await db.from("services").delete().eq("id",id);if(r.error)alert(r.error.message);load();};
document.getElementById("serviceForm").addEventListener("submit",async e=>{e.preventDefault();const d=new FormData(e.currentTarget);const r=await db.from("services").insert({name:String(d.get("name")).trim(),category:String(d.get("category")).trim(),price_label:String(d.get("price_label")||"Уточнюйте").trim(),duration_minutes:Number(d.get("duration_minutes")),description:String(d.get("description")||"").trim()});document.getElementById("msg").textContent=r.error?r.error.message:"Послугу додано.";if(!r.error)e.currentTarget.reset();load();});load();
</script></body></html>
