<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Форум — Stars Beauty</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#fffdf7,#f5e3b5);font:15px Arial,sans-serif;color:#302719;line-height:1.55}.wrap{max-width:950px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}.brand{font:700 26px Georgia;color:#8c6824;text-decoration:none}.btn{border:0;border-radius:10px;background:#c59b42;color:#fff;padding:11px 16px;font-weight:700;cursor:pointer;text-decoration:none}.panel,.topic{background:#fffdf7;border:1px solid #e8d8b5;border-radius:17px;padding:20px;margin:18px 0;box-shadow:0 8px 26px #70501a12}.intro{background:linear-gradient(125deg,#f3dfaa,#fff9e8)}h1{font:600 38px Georgia;margin:8px 0}h2{font:600 24px Georgia;margin:0 0 12px}.muted{color:#7b705d}input,textarea{width:100%;padding:12px;border:1px solid #e4d7bc;border-radius:10px;font:inherit;margin:6px 0 12px}textarea{min-height:100px}.topic{margin:12px 0}.topic h3{margin:0 0 6px}.reply{padding:12px;background:#faf3df;border-radius:10px;margin:8px 0}.status{color:#8a671e;font-size:13px}.empty{text-align:center;padding:25px;color:#85775c}
</style></head><body><main class="wrap"><div class="top"><a class="brand" href="index.html">✦ Stars Beauty</a><a class="btn" href="index.html">На головну</a></div><section class="panel intro"><h1>Форум Stars Beauty</h1><p>Запитуйте, діліться порадами та спілкуйтеся. Нові теми й повідомлення з’являються після перевірки адміністрацією.</p></section><section class="panel"><h2>Створити тему</h2><form id="topicForm"><input name="author_name" required minlength="2" maxlength="60" placeholder="Ваше ім’я"><input name="title" required minlength="4" maxlength="120" placeholder="Назва теми"><textarea name="body" required minlength="5" maxlength="3000" placeholder="Про що хочете поговорити?"></textarea><button class="btn">Надіслати тему</button><p id="topicStatus" class="status"></p></form></section><section class="panel"><h2>Обговорення</h2><div id="topics"><div class="empty">Завантажуємо теми…</div></div></section></main><script>
const db=window.supabase.createClient("https://evtamvfgftwymlttzvxh.supabase.co","sb_publishable__ERwIrzKtseUBZ60gRHefg_lh4E68K6");const esc=v=>String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");
async function load(){const r=await db.from("stars_forum_topics").select("id,author_name,title,body,created_at").eq("status","approved").order("created_at",{ascending:false}).limit(40);if(r.error){document.getElementById("topics").innerHTML='<div class="empty">Не вдалося завантажити форум.</div>';return;}if(!r.data.length){document.getElementById("topics").innerHTML='<div class="empty">Поки що тем немає. Створіть першу!</div>';return;}let out="";for(const t of r.data){const p=await db.from("stars_forum_posts").select("author_name,body,created_at").eq("topic_id",t.id).eq("status","approved").order("created_at");out+='<article class="topic"><h3>'+esc(t.title)+'</h3><div class="muted">'+esc(t.author_name)+' · '+new Date(t.created_at).toLocaleDateString("uk-UA")+'</div><p>'+esc(t.body)+'</p>'+(p.data||[]).map(x=>'<div class="reply"><b>'+esc(x.author_name)+'</b><p>'+esc(x.body)+'</p></div>').join("")+'<form class="replyForm" data-id="'+t.id+'"><input name="author_name" required minlength="2" maxlength="60" placeholder="Ваше ім’я"><textarea name="body" required minlength="2" maxlength="2000" placeholder="Напишіть відповідь"></textarea><button class="btn">Відправити відповідь</button><span class="status"></span></form></article>';}document.getElementById("topics").innerHTML=out;document.querySelectorAll(".replyForm").forEach(f=>f.addEventListener("submit",async e=>{e.preventDefault();const d=new FormData(f);const b=f.querySelector("button");b.disabled=true;const q=await db.from("stars_forum_posts").insert({topic_id:f.dataset.id,author_name:String(d.get("author_name")).trim(),body:String(d.get("body")).trim(),status:"pending"});f.querySelector(".status").textContent=q.error?"Не вдалося надіслати відповідь.":"Відповідь надіслана на перевірку.";if(!q.error)f.reset();b.disabled=false;}));}
document.getElementById("topicForm").addEventListener("submit",async e=>{e.preventDefault();const f=e.currentTarget,b=f.querySelector("button"),d=new FormData(f);b.disabled=true;const r=await db.from("stars_forum_topics").insert({author_name:String(d.get("author_name")).trim(),title:String(d.get("title")).trim(),body:String(d.get("body")).trim(),status:"pending"});document.getElementById("topicStatus").textContent=r.error?"Не вдалося надіслати тему.":"Дякуємо! Тему надіслано на перевірку.";if(!r.error)f.reset();b.disabled=false;});load();
</script></body></html>
